<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xmood</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --edge: #30363d;
      --fg: #e6edf3;
      --muted: #8b949e;
      --bull: #3fb950;
      --neut: #d29922;
      --bear: #f85149;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 22px; font-weight: 650; margin: 0 0 16px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    .seg {
      display: inline-flex;
      border: 1px solid var(--edge);
      border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .seg button {
      background: #21262d;
      color: var(--muted);
      border: 0;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .seg button.on {
      background: #30363d;
      color: var(--fg);
    }
    .field-slot { position: relative; }
    #status {
      display: block;
      font-size: 13px;
      line-height: 1.45em;
      height: 1.45em;
      overflow: hidden;
      color: var(--muted);
      margin: 0 0 18px;
      text-align: left;
    }
    #status.err { color: var(--bear); }
    input[name="ticker"],
    #sectorBox {
      background: #21262d; color: var(--fg); border: 1px solid var(--edge);
      border-radius: 8px; padding: 10px 12px; font-size: 16px; width: 140px;
    }
    input[name="ticker"] { letter-spacing: 0.04em; }
    #sectorBox { width: 260px; cursor: pointer; }
    #sectorMenu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 30;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 8px;
      min-width: 280px;
      max-height: 340px;
      overflow: auto;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #sectorMenu.open { display: block; }
    #sectorFilter {
      width: 100%;
      background: #21262d;
      color: var(--fg);
      border: 1px solid var(--edge);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .sec-hd {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 8px 8px 4px;
    }
    .sec-ind {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 0;
      border-radius: 6px;
      padding: 6px 10px 6px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .sec-ind:hover { background: #21262d; }
    .context {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 0;
    }
    .context.idle, .context:empty { display: none; }
    .context button {
      background: none;
      border: 0;
      padding: 0;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .context button:hover { color: var(--blue); }
    button#go {
      background: #1f6feb; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 16px; font-size: 15px; cursor: pointer; font-weight: 600;
    }
    button#go:hover { background: #388bfd; }
    button#go:disabled, button#go:disabled:hover {
      background: #1f6feb;
      opacity: 0.4;
      cursor: not-allowed;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 18px; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .score { font-size: 64px; font-weight: 700; line-height: 1; }
    .score.null { color: #6e7681; }
    .label { font-size: 18px; margin: 6px 0 14px; }
    .label.idle { font-size: 13px; color: var(--muted); font-weight: 400; margin: 8px 0 0; }
    .bars.idle { display: none; }
    .score.idle { display: none; }
    .blurb.idle { display: none; }
    .blurb { margin-top: 16px; font-size: 13px; line-height: 1.45; }
    .blurb .mood { color: var(--muted); margin: 0 0 12px; }
    .blurb .side { margin: 0 0 10px; }
    .blurb .side:last-child { margin-bottom: 0; }
    .blurb .side-label { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; margin-bottom: 2px; }
    .blurb .side-label.bull { color: var(--bull); }
    .blurb .side-label.bear { color: var(--bear); }
    .blurb .side p { margin: 0; color: var(--fg); }
    .counts { color: var(--muted); font-size: 13px; margin-top: 12px; }
    .bar-row { display: grid; grid-template-columns: 80px 1fr 90px; gap: 8px; align-items: center; margin: 8px 0; }
    .track { background: #21262d; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--edge); }
    .fill { height: 100%; }
    svg.meter { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
    .posts { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .post { background: #21262d; border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; border-left: 4px solid var(--edge); }
    .post.bull { border-left-color: var(--bull); }
    .post.bear { border-left-color: var(--bear); }
    .post.neutral { border-left-color: var(--neut); }
    .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge.bull { color: var(--bull); }
    .badge.bear { color: var(--bear); }
    .badge.neutral { color: var(--neut); }
    .who { color: var(--muted); font-size: 12px; }
    .orig { margin-top: 4px; }
    .en { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .empty { color: var(--muted); padding: 12px 0; }
    footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
    .err { color: var(--bear); font-size: 13px; }
    #picks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .pick { background: #21262d; color: var(--fg); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; font-weight: 500; }
    .pick:hover { border-color: var(--blue); }
    .pick b { display: block; }
    .pick span { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Xmood</h1>
    <div class="row">
      <div class="seg" role="tablist" aria-label="Scan mode">
        <button type="button" class="on" id="modeSymbol" role="tab" aria-selected="true">Symbol</button>
        <button type="button" id="modeSector" role="tab" aria-selected="false">Sector</button>
      </div>
      <div class="field-slot" id="symbolSlot">
        <input type="text" name="ticker" id="ticker" placeholder="Symbol" maxlength="12" autocomplete="off" autofocus />
      </div>
      <div class="field-slot" id="sectorSlot" hidden>
        <input type="text" id="sectorBox" placeholder="Choose sector" readonly autocomplete="off" />
        <div id="sectorMenu">
          <input type="search" id="sectorFilter" placeholder="Filter" autocomplete="off" />
          <div id="sectorList"></div>
        </div>
      </div>
      <button type="button" id="go">Pull</button>
    </div>
    <div id="status"></div>
    <div id="picks"></div>
    <div class="grid">
      <div class="card">
        <div class="meta" id="sub"></div>
        <svg class="meter" id="meter" viewBox="0 0 400 230" aria-label="Mood meter">
          <g id="bands"></g>
          <line id="needle" x1="200" y1="200" x2="200" y2="40" stroke="#6e7681" stroke-width="4" stroke-linecap="round" />
          <circle cx="200" cy="200" r="7" fill="#6e7681" id="hub" />
          <text x="28" y="214" fill="#8b949e" font-size="12">0</text>
          <text x="352" y="214" fill="#8b949e" font-size="12">100</text>
        </svg>
        <div class="context idle" id="contextLine"></div>
        <div class="score null idle" id="scoreNum"></div>
        <div class="label idle" id="scoreLabel">No result yet</div>
        <div id="bars" class="bars idle">
        <div class="bar-row"><span>Bullish</span><div class="track"><div class="fill" id="bBull" style="width:0;background:var(--bull)"></div></div><span id="tBull">0 · 0%</span></div>
        <div class="bar-row"><span>No view</span><div class="track"><div class="fill" id="bNeut" style="width:0;background:var(--neut)"></div></div><span id="tNeut">0 · 0%</span></div>
        <div class="bar-row"><span>Bearish</span><div class="track"><div class="fill" id="bBear" style="width:0;background:var(--bear)"></div></div><span id="tBear">0 · 0%</span></div>
        </div>
        <div id="blurb" class="blurb idle">
          <p class="mood" id="blurbSummary"></p>
          <div class="side">
            <div class="side-label bull">Bull</div>
            <p id="blurbBull"></p>
          </div>
          <div class="side">
            <div class="side-label bear">Bear</div>
            <p id="blurbBear"></p>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="posts" id="posts"></div>
      </div>
    </div>
  </div>
  <script>
    const LAST_PAYLOAD = {
      "ticker": "",
      "as_of": "",
      "window": "last 7 days",
      "query": "",
      "credits_estimate_usd": 0.50,
      "n_fetched": 0,
      "n_kept": 0,
      "n_spam": 0,
      "bull": 0,
      "bear": 0,
      "neutral": 0,
      "score": null,
      "label": "",
      "posts": [],
      "history": []
    };

    let LIVE = null;
    let PULLING = false;
    let MODE = "symbol";
    let chosen = null;
    let sectorPick = null;
    let SECTORS = [];
    let lookupTimer = 0;

    function polar(score) {
      const s = Math.max(0, Math.min(100, Number(score)));
      const rad = (180 - 1.8 * s) * Math.PI / 180;
      return { x: 200 + Math.cos(rad) * 150, y: 200 - Math.sin(rad) * 150 };
    }

    function drawBands() {
      const g = document.getElementById("bands");
      g.innerHTML = "";
      const colors = [
        [0, 20, "#da3633"],
        [20, 40, "#db6d28"],
        [40, 60, "#d29922"],
        [60, 80, "#3fb950"],
        [80, 100, "#238636"]
      ];
      colors.forEach(([lo, hi, c]) => {
        const a0 = (180 - 1.8 * lo) * Math.PI / 180;
        const a1 = (180 - 1.8 * hi) * Math.PI / 180;
        const rO = 160, rI = 112;
        const x0o = 200 + Math.cos(a0) * rO, y0o = 200 - Math.sin(a0) * rO;
        const x1o = 200 + Math.cos(a1) * rO, y1o = 200 - Math.sin(a1) * rO;
        const x0i = 200 + Math.cos(a0) * rI, y0i = 200 - Math.sin(a0) * rI;
        const x1i = 200 + Math.cos(a1) * rI, y1i = 200 - Math.sin(a1) * rI;
        const large = (hi - lo) > 50 ? 1 : 0;
        const d = `M ${x0o} ${y0o} A ${rO} ${rO} 0 ${large} 1 ${x1o} ${y1o} L ${x1i} ${y1i} A ${rI} ${rI} 0 ${large} 0 ${x0i} ${y0i} Z`;
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", c);
        g.appendChild(p);
      });
    }

    function setNeedle(score) {
      const needle = document.getElementById("needle");
      const hub = document.getElementById("hub");
      if (score === null || score === undefined || Number.isNaN(Number(score))) {
        needle.setAttribute("x2", "200");
        needle.setAttribute("y2", "50");
        needle.setAttribute("stroke", "#6e7681");
        hub.setAttribute("fill", "#6e7681");
        return;
      }
      const pt = polar(score);
      needle.setAttribute("x2", String(pt.x));
      needle.setAttribute("y2", String(pt.y));
      needle.setAttribute("stroke", "#f0f6fc");
      hub.setAttribute("fill", "#f0f6fc");
    }

    function pct(n, d) {
      if (!d) return 0;
      return Math.round(100 * n / d);
    }

    function emptyPayload() {
      return {
        mode: MODE,
        ticker: "",
        as_of: "",
        window: "last 7 days",
        query: "",
        credits_estimate_usd: 0.50,
        n_fetched: 0,
        n_kept: 0,
        n_spam: 0,
        bull: 0,
        bear: 0,
        neutral: 0,
        score: null,
        label: "",
        industry: "",
        sector: "",
        company: "",
        posts: [],
        history: []
      };
    }

    function originalText(p) {
      return p.text_original || p.text || "";
    }

    function setContext(payload, ready) {
      const el = document.getElementById("contextLine");
      el.innerHTML = "";
      if (!ready) {
        el.className = "context idle";
        return;
      }
      const isSector = (payload.mode || MODE) === "sector";
      if (isSector) {
        const sector = payload.sector || "";
        if (!sector) {
          el.className = "context idle";
          return;
        }
        el.className = "context";
        el.textContent = sector;
        return;
      }
      const industry = payload.industry || "";
      if (!industry) {
        el.className = "context idle";
        return;
      }
      el.className = "context";
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = industry;
      b.addEventListener("click", () => {
        if (PULLING) return;
        pullSector(industry, payload.sector || "");
      });
      el.appendChild(b);
    }

    function render(payload, notice) {
      const ready = Boolean(payload.as_of) || (payload.posts || []).length || Number(payload.n_fetched || 0);
      const isSector = (payload.mode || "") === "sector";
      document.getElementById("sub").textContent = ready
        ? (isSector
          ? (payload.industry || payload.company || "")
          : [payload.company, payload.display_ticker || payload.ticker].filter(Boolean).join(" · "))
        : "";
      setNeedle(ready ? payload.score : null);
      setContext(payload, ready);
      const sn = document.getElementById("scoreNum");
      const sl = document.getElementById("scoreLabel");
      const bars = document.getElementById("bars");
      if (!ready) {
        sn.textContent = "";
        sn.className = "score null idle";
        sl.textContent = "No result yet";
        sl.className = "label idle";
        bars.className = "bars idle";
      } else if (payload.score === null || payload.score === undefined) {
        sn.textContent = "";
        sn.className = "score null idle";
        sl.textContent = payload.label || "No result yet";
        sl.className = "label idle";
        bars.className = "bars idle";
      } else {
        sn.textContent = String(payload.score);
        sn.className = "score";
        sl.textContent = payload.label || "";
        sl.className = "label";
        bars.className = "bars";
      }
      const kept = Number(payload.n_kept || 0);
      const bull = Number(payload.bull || 0);
      const bear = Number(payload.bear || 0);
      const neut = Number(payload.neutral || 0);
      document.getElementById("bBull").style.width = pct(bull, kept) + "%";
      document.getElementById("bNeut").style.width = pct(neut, kept) + "%";
      document.getElementById("bBear").style.width = pct(bear, kept) + "%";
      document.getElementById("tBull").textContent = bull + " · " + pct(bull, kept) + "%";
      document.getElementById("tNeut").textContent = neut + " · " + pct(neut, kept) + "%";
      document.getElementById("tBear").textContent = bear + " · " + pct(bear, kept) + "%";
      const blurb = document.getElementById("blurb");
      const thesis = payload.thesis || {};
      const hasThesis = Boolean(thesis.summary || thesis.bull || thesis.bear);
      document.getElementById("blurbSummary").textContent = hasThesis ? (thesis.summary || "") : "";
      document.getElementById("blurbBull").textContent = hasThesis ? (thesis.bull || "") : "";
      document.getElementById("blurbBear").textContent = hasThesis ? (thesis.bear || "") : "";
      blurb.className = ready && hasThesis ? "blurb" : "blurb idle";
      const box = document.getElementById("posts");
      box.innerHTML = "";
      const posts = payload.posts || [];
      if (posts.length) {
        posts.slice(0, 12).forEach(p => {
          const el = document.createElement("div");
          const c = p.classification || "neutral";
          el.className = "post " + c;
          const badge = document.createElement("span");
          badge.className = "badge " + c;
          badge.textContent = c === "bull" ? "Bullish" : c === "bear" ? "Bearish" : c === "spam" ? "Spam" : "No view";
          const who = document.createElement("span");
          who.className = "who";
          const bits = [];
          if (p.username) bits.push("@" + String(p.username).replace(/^@/, ""));
          if (p.created_at) bits.push(p.created_at);
          who.textContent = bits.length ? "  " + bits.join(" · ") : "";
          const txt = document.createElement("div");
          txt.className = "orig";
          txt.textContent = originalText(p);
          el.appendChild(badge);
          el.appendChild(who);
          el.appendChild(txt);
          if (p.reason) {
            const why = document.createElement("div");
            why.className = "en";
            why.textContent = p.reason;
            el.appendChild(why);
          }
          if (p.translated === true) {
            const en = document.createElement("div");
            en.className = "en";
            en.textContent = p.text_en || "";
            el.appendChild(en);
          }
          box.appendChild(el);
        });
      }
      if (notice) setStatus(notice, true);
      else if (!PULLING) setStatus("", false);
    }

    function showPicks(matches) {
      const box = document.getElementById("picks");
      if (!box) return;
      box.innerHTML = "";
      (matches || []).forEach(m => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pick";
        b.innerHTML = "<b></b><span></span>";
        b.querySelector("b").textContent = m.symbol || "";
        b.querySelector("span").textContent = [m.name, m.exchange].filter(Boolean).join(" · ");
        b.addEventListener("click", () => {
          document.getElementById("ticker").value = m.symbol || "";
          chosen = { symbol: m.symbol || "", name: m.name || "" };
          box.innerHTML = "";
          pullConfirmed(m.symbol, m.name);
        });
        box.appendChild(b);
      });
    }

    function setStatus(text, isErr) {
      const st = document.getElementById("status");
      st.className = isErr ? "err" : "";
      st.textContent = text || "";
    }

    function setPulling(on) {
      PULLING = on;
      const go = document.getElementById("go");
      go.disabled = on;
      go.textContent = "Pull";
      go.setAttribute("aria-busy", on ? "true" : "false");
    }

    function setMode(mode, opts) {
      MODE = mode === "sector" ? "sector" : "symbol";
      const focus = !opts || opts.focus !== false;
      const silent = Boolean(opts && opts.silent);
      const symBtn = document.getElementById("modeSymbol");
      const secBtn = document.getElementById("modeSector");
      symBtn.classList.toggle("on", MODE === "symbol");
      secBtn.classList.toggle("on", MODE === "sector");
      symBtn.setAttribute("aria-selected", MODE === "symbol" ? "true" : "false");
      secBtn.setAttribute("aria-selected", MODE === "sector" ? "true" : "false");
      document.getElementById("symbolSlot").hidden = MODE !== "symbol";
      document.getElementById("sectorSlot").hidden = MODE !== "sector";
      closeSectorMenu();
      const pb = document.getElementById("picks");
      if (pb) pb.innerHTML = "";
      setStatus("", false);
      if (!silent) {
        LIVE = null;
        render(emptyPayload(), "");
      }
      if (!focus || PULLING) return;
      if (MODE === "symbol") document.getElementById("ticker").focus();
      else document.getElementById("sectorBox").focus();
    }

    function closeSectorMenu() {
      document.getElementById("sectorMenu").classList.remove("open");
    }

    function openSectorMenu() {
      document.getElementById("sectorMenu").classList.add("open");
      const f = document.getElementById("sectorFilter");
      f.value = "";
      drawSectorList("");
      f.focus();
    }

    function drawSectorList(filter) {
      const box = document.getElementById("sectorList");
      box.innerHTML = "";
      const q = (filter || "").trim().toLowerCase();
      (SECTORS || []).forEach(row => {
        const sector = row.sector || "";
        const inds = (row.industries || []).filter(n => {
          if (!q) return true;
          return String(n).toLowerCase().includes(q) || sector.toLowerCase().includes(q);
        });
        if (!inds.length) return;
        const hd = document.createElement("div");
        hd.className = "sec-hd";
        hd.textContent = sector;
        box.appendChild(hd);
        inds.forEach(name => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "sec-ind";
          b.textContent = name;
          b.addEventListener("click", () => pickIndustry(name, sector));
          box.appendChild(b);
        });
      });
    }

    function pickIndustry(industry, sector) {
      sectorPick = { industry, sector };
      document.getElementById("sectorBox").value = industry;
      closeSectorMenu();
    }

    async function consumePull(r, fallbackTicker) {
      const ctype = (r.headers.get("content-type") || "").toLowerCase();
      if (ctype.includes("ndjson") || ctype.includes("jsonl")) {
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        let last = null;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (!line) continue;
            const ev = JSON.parse(line);
            if (ev.t === "status" && ev.text) setStatus(ev.text, false);
            if (ev.t === "error") {
              setStatus(ev.detail || "Pull failed.", true);
              return;
            }
            if (ev.t === "done") last = ev.result;
          }
        }
        if (last) {
          LIVE = last;
          setStatus("", false);
          render(last, "");
        }
        return;
      }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        setStatus(j.detail || "Pull failed.", true);
        return;
      }
      if (j.status === "pick") {
        showPicks(j.matches || []);
        setStatus(j.detail || "Pick the listing.", false);
        return;
      }
      if (j.status === "none") {
        showPicks([]);
        setStatus(j.detail || "None found.", false);
        return;
      }
      LIVE = j;
      setStatus("", false);
      render(j, "");
    }

    async function pullConfirmed(symbol, name) {
      if (PULLING) return;
      setPulling(true);
      setStatus("Searching X…", false);
      try {
        const r = await fetch("/api/pull", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "symbol",
            ticker: symbol,
            symbol: symbol,
            name: name || "",
            confirmed: true
          })
        });
        await consumePull(r, symbol);
      } catch (e) {
        setStatus("Could not reach the local server. Is it running?", true);
      } finally {
        setPulling(false);
      }
    }

    async function pullSector(industry, sector) {
      if (PULLING) return;
      industry = (industry || "").trim();
      if (!industry) {
        setMode("sector");
        openSectorMenu();
        setStatus("Pick an industry from the list.", false);
        return;
      }
      setMode("sector", { focus: false });
      sectorPick = { industry, sector: sector || "" };
      document.getElementById("sectorBox").value = industry;
      closeSectorMenu();
      const pb = document.getElementById("picks");
      if (pb) pb.innerHTML = "";
      setPulling(true);
      setStatus("Searching X…", false);
      try {
        const r = await fetch("/api/pull", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "sector",
            industry,
            sector: sector || ""
          })
        });
        await consumePull(r, industry);
      } catch (e) {
        setStatus("Could not reach the local server. Is it running?", true);
      } finally {
        setPulling(false);
      }
    }

    async function lookupTyped(typed) {
      if (MODE !== "symbol") return;
      typed = (typed || "").trim();
      if (!typed) {
        const pb = document.getElementById("picks");
        if (pb) pb.innerHTML = "";
        return;
      }
      try {
        const r = await fetch("/api/lookup?q=" + encodeURIComponent(typed));
        const j = await r.json().catch(() => ({}));
        if (MODE !== "symbol" || PULLING) return;
        showPicks(j.matches || []);
      } catch (e) {}
    }

    async function pull() {
      if (PULLING) return;
      if (MODE === "sector") {
        if (!sectorPick || !sectorPick.industry) {
          openSectorMenu();
          setStatus("Pick an industry from the list.", false);
          return;
        }
        await pullSector(sectorPick.industry, sectorPick.sector);
        return;
      }
      const typed = (document.getElementById("ticker").value || "").trim().toUpperCase();
      if (!typed) {
        document.getElementById("ticker").focus();
        return;
      }
      if (chosen && (chosen.symbol || "").toUpperCase() === typed) {
        const pb = document.getElementById("picks");
        if (pb) pb.innerHTML = "";
        await pullConfirmed(chosen.symbol, chosen.name);
        return;
      }
      const pb = document.getElementById("picks"); if (pb) pb.innerHTML = "";
      setPulling(true);
      setStatus("Looking up listings…", false);
      try {
        const r = await fetch("/api/pull", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: "symbol", ticker: typed })
        });
        await consumePull(r, typed);
      } catch (e) {
        setStatus("Could not reach the local server. Is it running?", true);
      } finally {
        setPulling(false);
      }
    }

    document.getElementById("go").addEventListener("click", pull);
    document.getElementById("ticker").addEventListener("keydown", e => {
      if (e.key === "Enter") pull();
    });
    document.getElementById("ticker").addEventListener("input", () => {
      chosen = null;
      const typed = (document.getElementById("ticker").value || "").trim();
      clearTimeout(lookupTimer);
      lookupTimer = setTimeout(() => lookupTyped(typed), 180);
    });
    document.getElementById("modeSymbol").addEventListener("click", () => setMode("symbol"));
    document.getElementById("modeSector").addEventListener("click", () => setMode("sector"));
    document.getElementById("sectorBox").addEventListener("focus", () => {
      if (!PULLING) openSectorMenu();
    });
    document.getElementById("sectorBox").addEventListener("click", () => {
      if (!PULLING) openSectorMenu();
    });
    document.getElementById("sectorBox").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        pull();
      } else if (e.key === "Escape") {
        closeSectorMenu();
      } else if (e.key.length === 1 || e.key === "Backspace") {
        openSectorMenu();
      }
    });
    document.getElementById("sectorFilter").addEventListener("input", e => {
      drawSectorList(e.target.value);
    });
    document.getElementById("sectorFilter").addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeSectorMenu();
        document.getElementById("sectorBox").focus();
      }
    });
    document.addEventListener("click", e => {
      const slot = document.getElementById("sectorSlot");
      if (slot && !slot.contains(e.target)) closeSectorMenu();
    });

    drawBands();
    render(LAST_PAYLOAD, "");

    fetch("/api/sectors")
      .then(r => { if (!r.ok) throw new Error("no sectors"); return r.json(); })
      .then(j => { SECTORS = j.sectors || []; })
      .catch(() => {});

    fetch("/api/status")
      .then(r => { if (!r.ok) throw new Error("no status"); return r.json(); })
      .then(j => {
        if (!j || j.status === "idle" || (!j.n_fetched && !(j.posts || []).length)) return;
        LIVE = j;
        if (j.mode === "sector") {
          setMode("sector", { focus: false, silent: true });
          if (j.industry) {
            sectorPick = { industry: j.industry, sector: j.sector || "" };
            document.getElementById("sectorBox").value = j.industry;
          }
        }
        render(j, "");
      })
      .catch(() => {});
  </script>
</body>
</html>
